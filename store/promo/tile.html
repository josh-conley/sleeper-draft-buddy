<!doctype html><meta charset="utf-8"><title>promo</title>
<style>
  /* Sized off tile height so it scales cleanly down to 440x280.
     The mark is the shipped extension icon, so the tile and the toolbar match. */
  html,body{margin:0;height:100%;overflow:hidden;}
  body{font:400 4.4vh/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e6e9f0;}
  .tile{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;gap:6%;padding:0 6%;
        box-sizing:border-box;
        background:radial-gradient(115% 150% at 85% 8%,#1e2432 0%,#13161d 58%,#0f1116 100%);}
  .mark{flex:0 0 auto;height:44%;width:auto;border-radius:23%;
        box-shadow:0 .18em .6em rgba(0,0,0,.55);image-rendering:auto;}
  .copy{min-width:0;}
  h1{margin:0;font-size:1.62em;font-weight:700;letter-spacing:-.02em;line-height:1.05;}
  p{margin:.30em 0 0;color:#9aa3b6;font-size:.86em;}
  .pill{display:inline-block;margin-top:.62em;padding:.30em .72em;border-radius:99px;
        background:rgba(23,201,100,.13);color:#17c964;font-size:.60em;font-weight:700;
        box-shadow:inset 0 0 0 1px rgba(23,201,100,.40);}
</style>
<div class="tile">
  <img class="mark" src="mark.png" alt="">
  <div class="copy">
    <h1>Draft&nbsp;Buddy</h1>
    <p>Your rankings, live on the Sleeper draft board</p>
    <span class="pill">PASTE NAMES · PLAYERS VANISH AS THEY GO</span>
  </div>
</div>
