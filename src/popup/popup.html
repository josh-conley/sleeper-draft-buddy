<!doctype html>
<meta charset="utf-8">
<title>Sleeper Draft Buddy</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <div class="head">
    <img src="../../icons/icon32.png" width="24" height="24" alt="">
    <div>
      <div class="name">Draft Buddy</div>
      <div class="ver" id="ver"></div>
    </div>
  </div>

  <div id="status" class="status">Checking…</div>

  <ol class="steps">
    <li>Open your draft on <b>sleeper.com</b></li>
    <li>Click the <b>⚙</b> on the panel and paste your player names</li>
    <li>Pick <b>your draft slot</b> in the toolbar</li>
  </ol>

  <div class="note" id="listnote"></div>
  <button id="open" class="btn">Open Sleeper</button>
</div>
<script src="popup.js"></script>
