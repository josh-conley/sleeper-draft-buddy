<!doctype html>
<meta charset="utf-8">
<title>Sleeper Draft Buddy</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <div class="head">
    <img src="../../icons/icon32.png" width="24" height="24" alt="">
    <div>
      <div class="name">Draft Buddy</div>
      <div class="ver" id="ver"></div>
    </div>
  </div>

  <div id="status" class="status">Checking…</div>

  <ol class="steps">
    <li>Open your draft on <b>sleeper.com</b></li>
    <li>Build your list in <b>My Rankings</b>, or paste one into the panel</li>
    <li><b>Drag players to rank</b> them — on the page or in the draft panel</li>
    <li>Pick <b>your draft slot</b> in the toolbar</li>
  </ol>

  <div class="noterow">
    <span class="note" id="listnote"></span>
    <button id="refresh" class="link" title="Re-read your list and push it to any open draft">Refresh</button>
  </div>

  <button id="rank" class="btn">Open my rankings</button>
  <button id="open" class="btn ghost">Open Sleeper</button>
</div>
<script src="popup.js"></script>
